<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GéoMINDEVEL - Centres d'État Civil du Cameroun</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; }

        #header {
            background: linear-gradient(135deg, #1a5632 0%, #2d8659 100%);
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1001;
            position: relative;
        }
        #header h1 { font-size: 17px; font-weight: 700; }
        #header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .header-right span { font-size: 11px; opacity: 0.9; }
        #toggle-sidebar-btn {
            display: none; background: none; border: 2px solid white;
            color: white; padding: 5px 9px; border-radius: 4px; cursor: pointer; font-size: 14px;
        }

        #container { display: flex; height: calc(100vh - 52px); }

        #sidebar {
            width: 310px; min-width: 310px;
            background: #1e2a38; color: #ecf0f1;
            overflow-y: auto; padding: 12px;
            z-index: 1000;
        }

        #sidebar h2 {
            font-size: 13px; margin: 16px 0 8px; padding-bottom: 5px;
            border-bottom: 2px solid #1a5632; color: #4CAF50;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        #sidebar h2:first-child { margin-top: 0; }

        .filter-group { margin-bottom: 10px; }
        .filter-group label { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 500; color: #bdc3c7; }
        .filter-group input[type="text"], .filter-group select {
            width: 100%; padding: 6px 8px; border: 1px solid #34495e;
            border-radius: 4px; font-size: 12px; background: #2c3e50; color: white;
        }
        .filter-group input:focus, .filter-group select:focus { outline: none; border-color: #4CAF50; }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 5px; }
        .checkbox-group label {
            display: flex; align-items: center; gap: 4px; font-size: 11px;
            cursor: pointer; color: #ecf0f1; background: #2c3e50; padding: 3px 7px; border-radius: 3px;
        }
        .checkbox-group input[type="checkbox"] { width: 13px; height: 13px; }

        .btn {
            padding: 7px 10px; border: none; border-radius: 4px; cursor: pointer;
            font-size: 11px; font-weight: 600; width: 100%; margin-top: 6px;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-primary { background: #1a5632; color: white; }
        .btn-primary:hover { background: #2d8659; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #e74c3c; }
        .btn-secondary { background: #34495e; color: white; }
        .btn-secondary:hover { background: #4a6278; }

        #stats {
            background: rgba(26,86,50,0.25); padding: 10px; border-radius: 6px;
            border: 1px solid rgba(76,175,80,0.3);
        }
        #stats .stat-number { font-size: 26px; font-weight: bold; color: #4CAF50; }
        #stats .stat-label { font-size: 10px; color: #bdc3c7; }
        #stats .stat-detail { font-size: 10px; color: #95a5a6; margin-top: 4px; line-height: 1.5; }

        .search-wrapper { position: relative; }
        #search-suggestions {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 9999;
            background: #2c3e50; border: 1px solid #4a6278; border-top: none;
            border-radius: 0 0 4px 4px; max-height: 200px; overflow-y: auto;
            display: none;
        }
        #search-suggestions .suggestion {
            padding: 6px 10px; font-size: 12px; color: #ecf0f1; cursor: pointer;
            border-bottom: 1px solid #3a4f63;
        }
        #search-suggestions .suggestion:hover,
        #search-suggestions .suggestion.active {
            background: #1a5632; color: #fff;
        }
        #search-suggestions .suggestion .hint {
            font-size: 10px; color: #95a5a6; margin-left: 6px;
        }

        .layer-toggles label {
            display: flex; align-items: center; gap: 5px;
            font-size: 11px; cursor: pointer; margin: 3px 0; color: #ecf0f1;
        }
        .layer-toggles input[type="checkbox"] { width: 14px; height: 14px; }

        #map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        /* LEGEND - semi-transparent & collapsible */
        #legend {
            position: absolute; bottom: 25px; right: 10px;
            background: rgba(255,255,255,0.88); backdrop-filter: blur(4px);
            padding: 10px 13px; border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 999;
            font-size: 11px; max-width: 210px; transition: all 0.3s;
        }
        #legend.collapsed { padding: 6px 10px; }
        #legend.collapsed .legend-body { display: none; }
        #legend-toggle {
            cursor: pointer; float: right; font-size: 14px; color: #666;
            background: none; border: none; padding: 0; line-height: 1;
        }
        #legend h3 { font-size: 12px; margin-bottom: 6px; color: #1a5632; font-weight: 700; }
        .legend-section { margin-bottom: 6px; }
        .legend-section strong { font-size: 10px; color: #555; }
        .legend-item { display: flex; align-items: center; margin: 3px 0; }
        .legend-circle {
            width: 11px; height: 11px; border-radius: 50%; margin-right: 7px;
            border: 1.5px solid white; box-shadow: 0 0 2px rgba(0,0,0,0.4);
        }
        .legend-line { width: 24px; height: 0; margin-right: 7px; flex-shrink: 0; }

        /* MEASURE TOOL */
        #measure-panel {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.95); backdrop-filter: blur(4px);
            padding: 8px 15px; border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 2000;
            font-size: 12px; display: none; align-items: center; gap: 10px;
        }
        #measure-panel.active { display: flex; }
        #measure-panel button {
            padding: 4px 10px; border: none; border-radius: 3px;
            cursor: pointer; font-size: 11px; font-weight: 600;
        }
        #measure-btn-distance { background: #2196F3; color: white; }
        #measure-btn-area { background: #9C27B0; color: white; }
        #measure-btn-clear { background: #f44336; color: white; }
        #measure-result { font-weight: 600; color: #333; min-width: 100px; }

        .measure-toolbar {
            position: absolute; top: 80px; right: 10px; z-index: 2000;
        }
        .measure-toolbar button {
            display: block; width: 36px; height: 36px; margin-bottom: 4px;
            background: white; border: 2px solid rgba(0,0,0,0.2); border-radius: 4px;
            cursor: pointer; font-size: 14px; color: #333; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .measure-toolbar button:hover { background: #f0f0f0; }
        .measure-toolbar button.active { background: #1a5632; color: white; border-color: #1a5632; }

        #gps-results { margin-top: 8px; max-height: 180px; overflow-y: auto; }
        .gps-result-item {
            background: rgba(52,152,219,0.15); border: 1px solid rgba(52,152,219,0.3);
            border-radius: 4px; padding: 6px; margin-bottom: 5px; font-size: 10px; line-height: 1.4;
        }
        .gps-result-item strong { color: #3498db; }
        .gps-result-item .distance { color: #e67e22; font-weight: 600; }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: flex;
            align-items: center; justify-content: center; z-index: 10000;
        }
        .loading-box { background: white; padding: 25px 35px; border-radius: 10px; text-align: center; }
        .loading-spinner {
            border: 4px solid #e0e0e0; border-top: 4px solid #1a5632;
            border-radius: 50%; width: 36px; height: 36px;
            animation: spin 0.8s linear infinite; margin: 0 auto 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .gps-marker { position: relative; width: 40px; height: 40px; }
        .gps-dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 18px; height: 18px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #64B5F6, #1565C0);
            border: 3px solid white;
            box-shadow: 0 2px 6px rgba(21,101,192,0.6), inset 0 -2px 4px rgba(0,0,0,0.2);
        }
        .gps-pulse {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(33,150,243,0.25);
            animation: gps-ping 1.5s ease-out infinite;
        }
        @keyframes gps-ping {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
        }
        .loading-box p { font-size: 13px; color: #333; }

        .popup-content { font-size: 12px; max-width: 280px; }
        .popup-content h4 { color: #1a5632; margin-bottom: 5px; font-size: 13px; border-bottom: 1px solid #eee; padding-bottom: 3px; }
        .popup-content table { width: 100%; border-collapse: collapse; }
        .popup-content td { padding: 2px 4px; vertical-align: top; font-size: 11px; }
        .popup-content td:first-child { font-weight: 600; color: #555; white-space: nowrap; padding-right: 6px; }

        #refresh-btn {
            background: none; border: 2px solid rgba(255,255,255,0.6);
            color: white; width: 32px; height: 32px; border-radius: 4px;
            cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        #refresh-btn:hover { background: rgba(255,255,255,0.15); border-color: white; }

        @media (max-width: 768px) {
            #toggle-sidebar-btn { display: block; }
            #sidebar {
                position: fixed; left: 0; top: 52px; bottom: 0; z-index: 1100;
                width: 85vw; min-width: auto;
                overflow-y: auto; -webkit-overflow-scrolling: touch;
                transform: translateX(0); transition: transform 0.3s ease;
            }
            #sidebar.collapsed { transform: translateX(-100%); }
            #header h1 { font-size: 14px; }
            #header p { display: none; }
            #legend { max-width: 180px; font-size: 10px; bottom: 15px; right: 5px; padding: 8px 10px; }
            .popup-content { max-width: 230px; }
            .popup-content td { font-size: 10px; }
            .popup-actions button { font-size: 9px; padding: 4px 6px; }
            #edit-mode-bar { font-size: 11px; padding: 8px 12px; gap: 8px; white-space: normal; max-width: 90vw; text-align: center; }
            #measure-panel { max-width: 90vw; font-size: 11px; padding: 6px 10px; }
            .measure-toolbar { top: 70px; right: 5px; }
            .measure-toolbar button { width: 32px; height: 32px; font-size: 12px; }
            .cec-modal { padding: 15px; width: 100%; }
            .cec-modal h3 { font-size: 14px; }
            .cec-modal .form-row-inline { flex-direction: column; gap: 0; }
            .cec-modal .form-row-inline .form-row { margin-bottom: 10px; }
        }
        @media (max-width: 400px) {
            #header { padding: 8px 10px; }
            #header h1 { font-size: 12px; }
            .header-right { gap: 5px; }
            #refresh-btn { width: 28px; height: 28px; font-size: 11px; }
            #toggle-sidebar-btn { padding: 4px 7px; font-size: 12px; }
            #sidebar { width: 100vw; }
            .popup-content { max-width: 200px; }
            #edit-mode-bar { font-size: 10px; padding: 6px 10px; }
            #legend { max-width: 150px; font-size: 9px; }
            .cec-modal .modal-actions { flex-direction: column; }
            .cec-modal .modal-actions .btn { width: 100%; }
        }
        /* CEC Management Modal */
        .cec-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: flex;
            align-items: center; justify-content: center; z-index: 10000;
        }
        .cec-modal {
            background: #fff; border-radius: 10px; padding: 20px; width: 420px;
            max-width: 95vw; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .cec-modal h3 {
            color: #1a5632; margin-bottom: 15px; font-size: 16px;
            border-bottom: 2px solid #4CAF50; padding-bottom: 8px;
        }
        .cec-modal .form-row { margin-bottom: 10px; }
        .cec-modal .form-row label {
            display: block; font-size: 11px; font-weight: 600;
            color: #555; margin-bottom: 3px;
        }
        .cec-modal .form-row input,
        .cec-modal .form-row select,
        .cec-modal .form-row textarea {
            width: 100%; padding: 7px 10px; border: 1px solid #ccc;
            border-radius: 4px; font-size: 12px; font-family: inherit;
        }
        .cec-modal .form-row input:focus,
        .cec-modal .form-row select:focus,
        .cec-modal .form-row textarea:focus { outline: none; border-color: #4CAF50; }
        .cec-modal .form-row input[readonly] { background: #f5f5f5; color: #888; }
        .cec-modal .form-row-inline { display: flex; gap: 10px; }
        .cec-modal .form-row-inline .form-row { flex: 1; margin-bottom: 0; }
        .cec-modal .modal-actions {
            display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end;
        }
        .cec-modal .modal-actions .btn { width: auto; padding: 8px 20px; }

        #edit-mode-bar {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(26,86,50,0.95); color: white;
            padding: 10px 18px; border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 2000;
            font-size: 12px; display: none; align-items: center; gap: 12px;
            white-space: nowrap;
        }
        #edit-mode-bar button {
            padding: 4px 10px; border: 1px solid rgba(255,255,255,0.5); border-radius: 3px;
            cursor: pointer; font-size: 11px; font-weight: 600;
            background: rgba(255,255,255,0.15); color: white;
        }
        #edit-mode-bar button:hover { background: rgba(255,255,255,0.3); }

        .popup-actions {
            display: flex; gap: 5px; margin-top: 8px; padding-top: 6px;
            border-top: 1px solid #eee;
        }
        .popup-actions button {
            flex: 1; padding: 5px 8px; border: none; border-radius: 3px;
            cursor: pointer; font-size: 10px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .popup-actions .btn-edit { background: #1a5632; color: white; }
        .popup-actions .btn-edit:hover { background: #2d8659; }
        .popup-actions .btn-move { background: #2196F3; color: white; }
        .popup-actions .btn-move:hover { background: #42A5F5; }
        .popup-actions .btn-delete { background: #d32f2f; color: white; }
        .popup-actions .btn-delete:hover { background: #ef5350; }
    </style>
</head>
<body>
    <div id="header">
        <div>
            <h1><i class="fas fa-map-marked-alt"></i> GéoMINDEVEL</h1>
            <p>Centres d'État Civil du Cameroun — MINDEVEL</p>
        </div>
        <div class="header-right">
            <span id="loading-status"></span>
            <button id="refresh-btn" onclick="location.reload()" title="Rafraîchir"><i class="fas fa-sync-alt"></i></button>
            <button id="toggle-sidebar-btn" onclick="document.getElementById('sidebar').classList.toggle('collapsed')"><i class="fas fa-bars"></i></button>
        </div>
    </div>

    <div id="container">
        <div id="sidebar">
            <div id="stats">
                <div class="stat-number" id="total-cec">—</div>
                <div class="stat-label">Centres d'État Civil affichés</div>
                <div class="stat-detail" id="type-stats"></div>
                <div class="stat-detail" id="filter-info"></div>
            </div>

            <h2><i class="fas fa-filter"></i> Filtres</h2>
            <div class="filter-group">
                <label><i class="fas fa-search"></i> Rechercher un CEC</label>
                <div class="search-wrapper">
                    <input type="text" id="search-cec" placeholder="Tapez un nom..." autocomplete="off">
                    <div id="search-suggestions"></div>
                </div>
            </div>
            <div class="filter-group">
                <label>Région</label>
                <select id="filter-region"><option value="">— Toutes les régions —</option></select>
            </div>
            <div class="filter-group">
                <label>Département</label>
                <select id="filter-departement"><option value="">— Tous les départements —</option></select>
            </div>
            <div class="filter-group">
                <label>Commune / Arrondissement</label>
                <select id="filter-commune"><option value="">— Toutes les communes —</option></select>
            </div>
            <div class="filter-group">
                <label>Type de CEC</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" class="type-filter" value="Principal" checked> Principal</label>
                    <label><input type="checkbox" class="type-filter" value="Secondaire" checked> Secondaire</label>
                    <label><input type="checkbox" class="type-filter" value="C.U." checked> C.U.</label>
                </div>
            </div>
            <button class="btn btn-danger" onclick="resetFilters()"><i class="fas fa-undo"></i> Réinitialiser</button>

            <h2><i class="fas fa-layer-group"></i> Couches</h2>
            <div class="layer-toggles">
                <label><input type="checkbox" id="toggle-regions" checked onchange="toggleLayer('regions')"> Régions</label>
                <label><input type="checkbox" id="toggle-departements" onchange="toggleLayer('departements')"> Départements</label>
                <label><input type="checkbox" id="toggle-arrondissements" onchange="toggleLayer('arrondissements')"> Arrondissements</label>
                <label><input type="checkbox" id="toggle-cec" checked onchange="toggleLayer('cec')"> Centres d'État Civil</label>
            </div>

            <h2><i class="fas fa-edit"></i> Gestion CEC</h2>
            <button class="btn btn-primary" onclick="startAddCEC()"><i class="fas fa-plus-circle"></i> Ajouter un CEC</button>

            <h2><i class="fas fa-location-crosshairs"></i> Géolocalisation</h2>
            <button class="btn btn-primary" onclick="getUserLocation()"><i class="fas fa-crosshairs"></i> Ma position GPS</button>
            <div class="filter-group" style="margin-top:8px;">
                <label>CEC les plus proches</label>
                <select id="closest-count">
                    <option value="3">3 plus proches</option>
                    <option value="5" selected>5 plus proches</option>
                    <option value="10">10 plus proches</option>
                </select>
            </div>
            <button class="btn btn-secondary" onclick="findClosestCEC()"><i class="fas fa-route"></i> Trouver les CEC proches</button>
            <div id="gps-results"></div>
        </div>

        <div id="map-container">
            <div id="map"></div>

            <!-- Edit mode bar -->
            <div id="edit-mode-bar">
                <span id="edit-mode-text"></span>
                <button onclick="cancelEditMode()"><i class="fas fa-times"></i> Annuler</button>
            </div>

            <!-- Measure toolbar -->
            <div class="measure-toolbar">
                <button id="btn-measure-dist" title="Mesurer une distance" onclick="startMeasure('distance')"><i class="fas fa-ruler"></i></button>
                <button id="btn-measure-area" title="Mesurer une superficie" onclick="startMeasure('area')"><i class="fas fa-draw-polygon"></i></button>
                <button id="btn-measure-clear" title="Effacer les mesures" onclick="clearMeasure()"><i class="fas fa-trash"></i></button>
            </div>

            <!-- Measure result display -->
            <div id="measure-panel">
                <span id="measure-result">—</span>
                <button id="measure-btn-clear" onclick="clearMeasure()">Effacer</button>
            </div>

            <!-- Legend -->
            <div id="legend">
                <button id="legend-toggle" onclick="toggleLegend()" title="Réduire/Agrandir"><i class="fas fa-chevron-down"></i></button>
                <h3><i class="fas fa-list"></i> Légende</h3>
                <div class="legend-body">
                    <div class="legend-section">
                        <strong>CEC par type :</strong>
                        <div class="legend-item"><div class="legend-circle" style="background:#6A1B9A;"></div> Principal</div>
                        <div class="legend-item"><div class="legend-circle" style="background:#FF9800;"></div> Secondaire</div>
                        <div class="legend-item"><div class="legend-circle" style="background:#f44336;"></div> C.U.</div>
                    </div>
                    <div class="legend-section">
                        <strong>Limites administratives :</strong>
                        <div class="legend-item"><div class="legend-line" style="border-top: 3px solid #d32f2f; width:24px;"></div> Régions</div>
                        <div class="legend-item"><div class="legend-line" style="border-top: 2px dashed #212121; width:24px;"></div> Départements</div>
                        <div class="legend-item"><div class="legend-line" style="border-top: 2px dashed #7B1FA2; width:24px;"></div> Arrondissements</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIG =====
        const SUPABASE_URL = 'https://hrlufnjhwhgddxkpyzst.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhybHVmbmpod2hnZGR4a3B5enN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI3MzIwMzcsImV4cCI6MjA2ODMwODAzN30.0gMYonFDAU84i3boEIKZDK4OQhDrAXXJySGDa80wTZ8';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== MAP =====
        const map = L.map('map', { zoomControl: true }).setView([7.37, 12.35], 6);

        const osmTiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);

        const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            subdomains: ['mt0','mt1','mt2','mt3'],
            attribution: '&copy; Google', maxZoom: 20
        });

        L.control.layers({ "OpenStreetMap": osmTiles, "Google Satellite": googleHybrid }, null, { position: 'topright' }).addTo(map);

        // Layers with proper z-index ordering:
        // Regions (bottom) -> Departments -> Arrondissements -> CEC (top)
        const regionsLayer = L.layerGroup().addTo(map);
        const departementsLayer = L.layerGroup();
        const arrondissementsLayer = L.layerGroup();
        const cecLayer = L.layerGroup().addTo(map);
        const closestLines = L.layerGroup().addTo(map);
        const measureLayer = L.layerGroup().addTo(map);

        // Ensure CEC pane is above overlays for popup priority
        map.createPane('adminPane');
        map.getPane('adminPane').style.zIndex = 350;
        map.createPane('cecPane');
        map.getPane('cecPane').style.zIndex = 650;
        map.createPane('closestCecPane');
        map.getPane('closestCecPane').style.zIndex = 660;
        map.createPane('measurePane');
        map.getPane('measurePane').style.zIndex = 700;

        let userMarker = null, userPosition = null;
        let allCEC = [], allRegions = [], allDepartements = [], allArrondissements = [];
        let filteredCEC = [];

        // ===== LOADING =====
        function showLoading(msg) {
            document.getElementById('loading-status').textContent = msg || '';
            if (!document.getElementById('loading-overlay')) {
                const el = document.createElement('div');
                el.id = 'loading-overlay'; el.className = 'loading-overlay';
                el.innerHTML = `<div class="loading-box"><div class="loading-spinner"></div><p>${msg||'Chargement...'}</p></div>`;
                document.body.appendChild(el);
            }
        }
        function hideLoading() {
            document.getElementById('loading-status').textContent = '';
            const el = document.getElementById('loading-overlay');
            if (el) el.remove();
        }

        // ===== LEGEND TOGGLE =====
        function toggleLegend() {
            const legend = document.getElementById('legend');
            legend.classList.toggle('collapsed');
            const icon = document.querySelector('#legend-toggle i');
            icon.className = legend.classList.contains('collapsed') ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
        }

        // ===== DATA LOADING (with pagination for >1000 rows) =====
        async function fetchAll(table) {
            let allData = [];
            let from = 0;
            const pageSize = 1000;
            while (true) {
                const { data, error } = await db
                    .from(table)
                    .select('*')
                    .range(from, from + pageSize - 1);
                if (error) throw new Error(`${table}: ${error.message}`);
                if (!data || data.length === 0) break;
                allData = allData.concat(data);
                if (data.length < pageSize) break;
                from += pageSize;
            }
            return allData;
        }

        async function loadAllData() {
            showLoading('Chargement des données...');
            try {
                allCEC = await fetchAll('national_cec_view');
                console.log(`CEC chargés: ${allCEC.length}`);

                allRegions = await fetchAll('regions_geojson');
                console.log(`Régions: ${allRegions.length}`);

                allDepartements = await fetchAll('departements_geojson');
                console.log(`Départements: ${allDepartements.length}`);

                allArrondissements = await fetchAll('arrondissements_geojson');
                console.log(`Arrondissements: ${allArrondissements.length}`);

                renderRegions();
                renderDepartements();
                renderArrondissements();
                populateFilters();
                applyFiltersAndRender();
                hideLoading();
            } catch (err) {
                hideLoading();
                console.error('Erreur:', err);
                alert('Erreur: ' + err.message);
            }
        }

        // ===== RENDER LAYERS =====
        function parseGeojson(val) {
            if (!val) return null;
            return typeof val === 'string' ? JSON.parse(val) : val;
        }

        function renderRegions() {
            regionsLayer.clearLayers();
            allRegions.forEach(r => {
                const gj = parseGeojson(r.geojson);
                if (!gj) return;
                const layer = L.geoJSON(gj, {
                    style: { color: '#d32f2f', weight: 3, fillOpacity: 0, dashArray: null },
                    interactive: true, pane: 'adminPane'
                });
                layer.eachLayer(l => {
                    l.bindPopup(`<div class="popup-content"><h4><i class="fas fa-globe-africa"></i> Région</h4><table><tr><td>Nom</td><td><strong>${r.nom_region}</strong></td></tr></table></div>`);
                });
                regionsLayer.addLayer(layer);
            });
        }

        function renderDepartements() {
            departementsLayer.clearLayers();
            allDepartements.forEach(d => {
                const gj = parseGeojson(d.geojson);
                if (!gj) return;
                const layer = L.geoJSON(gj, {
                    style: { color: '#212121', weight: 2, fillOpacity: 0, dashArray: '8,5' },
                    interactive: true, pane: 'adminPane'
                });
                layer.eachLayer(l => {
                    l.bindPopup(`<div class="popup-content"><h4><i class="fas fa-map"></i> Département</h4><table><tr><td>Nom</td><td><strong>${d.nom_departement}</strong></td></tr></table></div>`);
                });
                departementsLayer.addLayer(layer);
            });
        }

        function renderArrondissements() {
            arrondissementsLayer.clearLayers();
            allArrondissements.forEach(a => {
                const gj = parseGeojson(a.geojson);
                if (!gj) return;
                const layer = L.geoJSON(gj, {
                    style: { color: '#7B1FA2', weight: 1.5, fillOpacity: 0, dashArray: '5,4' },
                    interactive: true, pane: 'adminPane'
                });
                layer.eachLayer(l => {
                    l.bindPopup(`<div class="popup-content"><h4><i class="fas fa-map-pin"></i> Arrondissement</h4><table><tr><td>Nom</td><td><strong>${a.nom_arrondissement}</strong></td></tr></table></div>`);
                });
                arrondissementsLayer.addLayer(layer);
            });
        }

        // ===== CEC =====
        function getCECColor(type) {
            if (!type) return '#9E9E9E';
            const t = type.trim().toLowerCase();
            if (t === 'principal') return '#6A1B9A';
            if (t === 'secondaire' || t === 'sécondaire') return '#FF9800';
            if (t === 'c.u.') return '#f44336';
            return '#9E9E9E';
        }

        function renderCEC() {
            cecLayer.clearLayers();
            filteredCEC.forEach(cec => {
                if (!cec.lat || !cec.lng) return;
                const marker = L.circleMarker([cec.lat, cec.lng], {
                    radius: 6,
                    fillColor: getCECColor(cec.type_cec),
                    color: '#fff',
                    weight: 1.5,
                    fillOpacity: 0.9,
                    pane: 'cecPane'
                });
                marker.cecData = cec;
                marker.bindPopup(`
                    <div class="popup-content">
                        <h4><i class="fas fa-landmark"></i> ${cec.nom_cec || '—'}</h4>
                        <table>
                            <tr><td>Type</td><td>${cec.type_cec || '—'}</td></tr>
                            <tr><td>Commune</td><td>${cec.commune || '—'}</td></tr>
                            <tr><td>Département</td><td>${cec.departement || '—'}</td></tr>
                            <tr><td>Région</td><td>${cec.region || '—'}</td></tr>
                            <tr><td>N° Immatriculation</td><td>${cec.num_ima || '—'}</td></tr>
                            <tr><td>Code CEC</td><td>${cec.code_cec || '—'}</td></tr>
                            <tr><td>Réf. COG</td><td>${cec.ref_cog || '—'}</td></tr>
                            <tr><td>Observations</td><td>${cec.obs_req || '—'}</td></tr>
                            <tr><td>Date</td><td>${cec.date || '—'}</td></tr>
                        </table>
                        <div class="popup-actions">
                            <button class="btn-edit" onclick="openEditCEC(${cec.gid})"><i class="fas fa-pen"></i> Modifier</button>
                            <button class="btn-move" onclick="startMoveCEC(${cec.gid})"><i class="fas fa-arrows-alt"></i> Déplacer</button>
                            <button class="btn-delete" onclick="deleteCEC(${cec.gid})"><i class="fas fa-trash"></i> Supprimer</button>
                        </div>
                    </div>
                `);
                cecLayer.addLayer(marker);
            });
        }

        // ===== FILTERS =====
        function applyFiltersAndRender() {
            const searchText = document.getElementById('search-cec').value.trim().toLowerCase();
            const selRegion = document.getElementById('filter-region').value;
            const selDep = document.getElementById('filter-departement').value;
            const selCommune = document.getElementById('filter-commune').value;
            const checkedTypes = Array.from(document.querySelectorAll('.type-filter:checked')).map(cb => cb.value);

            filteredCEC = allCEC.filter(cec => {
                if (searchText && !(cec.nom_cec || '').toLowerCase().includes(searchText)) return false;
                if (selRegion && cec.region !== selRegion) return false;
                if (selDep && cec.departement !== selDep) return false;
                if (selCommune && cec.commune !== selCommune) return false;
                const type = (cec.type_cec || '').trim();
                const match = checkedTypes.some(ct => {
                    if (ct === 'Secondaire') return type === 'Secondaire' || type === 'Sécondaire';
                    if (ct === 'C.U.') return type === 'C.U.' || type === 'C.u.';
                    return type === ct;
                });
                return match;
            });
            renderCEC();
            updateStats();
        }

        function populateFilters() {
            const regions = [...new Set(allCEC.map(c => c.region).filter(Boolean))].sort();
            const sel = document.getElementById('filter-region');
            regions.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });
            updateDepartementOptions();
        }

        function updateDepartementOptions() {
            const selRegion = document.getElementById('filter-region').value;
            const depSel = document.getElementById('filter-departement');
            depSel.innerHTML = '<option value="">— Tous les départements —</option>';
            const deps = [...new Set(allCEC.filter(c => !selRegion || c.region === selRegion).map(c => c.departement).filter(Boolean))].sort();
            deps.forEach(d => { const o = document.createElement('option'); o.value = d; o.textContent = d; depSel.appendChild(o); });
            updateCommuneOptions();
        }

        function updateCommuneOptions() {
            const selRegion = document.getElementById('filter-region').value;
            const selDep = document.getElementById('filter-departement').value;
            const comSel = document.getElementById('filter-commune');
            comSel.innerHTML = '<option value="">— Toutes les communes —</option>';
            const communes = [...new Set(
                allCEC.filter(c => (!selRegion || c.region === selRegion) && (!selDep || c.departement === selDep))
                    .map(c => c.commune).filter(Boolean)
            )].sort();
            communes.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; comSel.appendChild(o); });
        }

        function resetFilters() {
            document.getElementById('search-cec').value = '';
            document.getElementById('filter-region').value = '';
            document.querySelectorAll('.type-filter').forEach(cb => cb.checked = true);
            updateDepartementOptions();
            applyFiltersAndRender();
            closestLines.clearLayers();
            document.getElementById('gps-results').innerHTML = '';
        }

        function updateStats() {
            document.getElementById('total-cec').textContent = filteredCEC.length;
            const counts = {};
            filteredCEC.forEach(c => {
                let t = (c.type_cec || 'Autre').trim();
                if (t === 'Sécondaire') t = 'Secondaire';
                if (t === 'C.u.') t = 'C.U.';
                counts[t] = (counts[t] || 0) + 1;
            });
            document.getElementById('type-stats').innerHTML = Object.entries(counts).map(([t, n]) => `<strong>${t}:</strong> ${n}`).join(' | ');
            const selR = document.getElementById('filter-region').value;
            const selD = document.getElementById('filter-departement').value;
            const selC = document.getElementById('filter-commune').value;
            let info = '';
            if (selR) info += `Région: ${selR}<br>`;
            if (selD) info += `Département: ${selD}<br>`;
            if (selC) info += `Commune: ${selC}`;
            document.getElementById('filter-info').innerHTML = info;
        }

        // ===== LAYER TOGGLE =====
        function toggleLayer(name) {
            const cb = document.getElementById('toggle-' + name);
            const layers = { regions: regionsLayer, departements: departementsLayer, arrondissements: arrondissementsLayer, cec: cecLayer };
            if (cb.checked) map.addLayer(layers[name]); else map.removeLayer(layers[name]);
        }

        // ===== GEOLOCATION =====
        let accuracyCircle = null;

        function getUserLocation() {
            if (!navigator.geolocation) { alert("Géolocalisation non supportée par ce navigateur."); return; }
            showLoading('Recherche de votre position GPS...');
            navigator.geolocation.getCurrentPosition(
                pos => {
                    hideLoading();
                    const accuracy = pos.coords.accuracy;
                    userPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: accuracy };

                    if (userMarker) map.removeLayer(userMarker);
                    if (accuracyCircle) map.removeLayer(accuracyCircle);

                    accuracyCircle = L.circle([userPosition.lat, userPosition.lng], {
                        radius: accuracy,
                        color: '#2196F3',
                        fillColor: '#2196F3',
                        fillOpacity: 0.1,
                        weight: 1,
                        dashArray: '4,4'
                    }).addTo(map);

                    const accuracyText = accuracy < 100 ? `${Math.round(accuracy)} m` : `~${(accuracy / 1000).toFixed(1)} km`;
                    const accuracyLevel = accuracy < 100 ? 'Excellente' : accuracy < 500 ? 'Bonne' : accuracy < 2000 ? 'Moyenne' : 'Faible (Wi-Fi/IP)';

                    userMarker = L.marker([userPosition.lat, userPosition.lng], {
                        icon: L.divIcon({
                            className: '',
                            html: '<div class="gps-marker"><div class="gps-pulse"></div><div class="gps-dot"></div></div>',
                            iconSize: [40, 40], iconAnchor: [20, 20]
                        })
                    }).addTo(map).bindPopup(
                        `<div class="popup-content"><h4><i class="fas fa-crosshairs"></i> Votre position</h4>` +
                        `<table><tr><td>Précision</td><td>${accuracyText}</td></tr>` +
                        `<tr><td>Qualité</td><td><strong>${accuracyLevel}</strong></td></tr>` +
                        `<tr><td>Lat</td><td>${userPosition.lat.toFixed(6)}</td></tr>` +
                        `<tr><td>Lng</td><td>${userPosition.lng.toFixed(6)}</td></tr></table></div>`
                    ).openPopup();

                    const zoom = accuracy < 500 ? 14 : accuracy < 2000 ? 12 : 11;
                    map.setView([userPosition.lat, userPosition.lng], zoom);
                },
                err => {
                    hideLoading();
                    const messages = {
                        1: "Permission refusée. Autorisez la géolocalisation dans les paramètres de votre navigateur.",
                        2: "Position indisponible. Vérifiez que la localisation est activée sur votre appareil.",
                        3: "Délai dépassé. Essayez à nouveau dans un endroit avec meilleure réception."
                    };
                    alert(messages[err.code] || 'Erreur GPS: ' + err.message);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function findClosestCEC() {
            if (!userPosition) { alert("Cliquez d'abord sur 'Ma position GPS'."); return; }
            const count = parseInt(document.getElementById('closest-count').value);
            const withDist = allCEC.filter(c => c.lat && c.lng)
                .map(c => ({ ...c, dist: haversine(userPosition.lat, userPosition.lng, c.lat, c.lng) }))
                .sort((a, b) => a.dist - b.dist).slice(0, count);

            closestLines.clearLayers();
            withDist.forEach(c => {
                L.polyline([[userPosition.lat, userPosition.lng], [c.lat, c.lng]], { color: '#e74c3c', weight: 2, dashArray: '6,6', opacity: 0.8 }).addTo(closestLines);
                L.circleMarker([c.lat, c.lng], { radius: 10, fillColor: '#e74c3c', color: '#fff', weight: 2, fillOpacity: 0.9, pane: 'closestCecPane' })
                    .addTo(closestLines).bindPopup(`
                        <div class="popup-content">
                            <h4><i class="fas fa-landmark"></i> ${c.nom_cec || '—'}</h4>
                            <table>
                                <tr><td>Type</td><td>${c.type_cec || '—'}</td></tr>
                                <tr><td>Commune</td><td>${c.commune || '—'}</td></tr>
                                <tr><td>Département</td><td>${c.departement || '—'}</td></tr>
                                <tr><td>Région</td><td>${c.region || '—'}</td></tr>
                                <tr><td>Distance</td><td><strong style="color:#e67e22;">${c.dist.toFixed(2)} km</strong></td></tr>
                                <tr><td>N° Immatriculation</td><td>${c.num_ima || '—'}</td></tr>
                                <tr><td>Code CEC</td><td>${c.code_cec || '—'}</td></tr>
                                <tr><td>Réf. COG</td><td>${c.ref_cog || '—'}</td></tr>
                                <tr><td>Observations</td><td>${c.obs_req || '—'}</td></tr>
                            </table>
                            <div class="popup-actions">
                                <button class="btn-edit" onclick="openEditCEC(${c.gid})"><i class="fas fa-pen"></i> Modifier</button>
                                <button class="btn-move" onclick="startMoveCEC(${c.gid})"><i class="fas fa-arrows-alt"></i> Déplacer</button>
                            </div>
                        </div>
                    `);
            });

            const accuracyWarning = userPosition.accuracy > 2000
                ? `<div style="background:rgba(231,76,60,0.2);border:1px solid rgba(231,76,60,0.4);border-radius:4px;padding:5px;margin-bottom:6px;font-size:10px;color:#e74c3c;">
                    <i class="fas fa-exclamation-triangle"></i> Précision GPS faible (~${(userPosition.accuracy/1000).toFixed(1)} km). Les distances sont approximatives.
                   </div>` : '';

            document.getElementById('gps-results').innerHTML = accuracyWarning + (withDist.map((c, i) => `
                <div class="gps-result-item">
                    <strong>${i+1}. ${c.nom_cec}</strong><br>
                    ${c.type_cec || '—'} — ${c.commune || '—'} — ${c.departement || '—'}<br>
                    <span class="distance"><i class="fas fa-route"></i> ${c.dist.toFixed(2)} km</span>
                </div>
            `).join('') || '<p style="font-size:11px;color:#95a5a6;">Aucun résultat</p>');

            if (withDist.length) {
                map.fitBounds(L.latLngBounds([[userPosition.lat, userPosition.lng], ...withDist.map(c => [c.lat, c.lng])]), { padding: [50, 50] });
            }
        }

        // ===== MEASURE TOOL =====
        let measureMode = null; // 'distance' or 'area'
        let measurePoints = [];
        let measurePolyline = null;
        let measurePolygon = null;
        let measureMarkers = [];

        function setLayersInteractive(enabled, includeAll) {
            const groups = [regionsLayer, departementsLayer, arrondissementsLayer];
            if (includeAll) { groups.push(cecLayer, closestLines); }
            groups.forEach(group => {
                group.eachLayer(layer => {
                    if (layer.eachLayer) {
                        layer.eachLayer(l => { if (l.getElement) { const el = l.getElement(); if (el) el.style.pointerEvents = enabled ? '' : 'none'; } });
                    }
                    if (layer.getElement) { const el = layer.getElement(); if (el) el.style.pointerEvents = enabled ? '' : 'none'; }
                });
            });
        }

        function startMeasure(mode) {
            clearMeasure();
            measureMode = mode;
            document.getElementById('measure-panel').classList.add('active');
            document.getElementById('measure-result').textContent = mode === 'distance' ? 'Cliquez pour mesurer' : 'Cliquez pour dessiner';
            document.getElementById('btn-measure-dist').classList.toggle('active', mode === 'distance');
            document.getElementById('btn-measure-area').classList.toggle('active', mode === 'area');
            map.getContainer().style.cursor = 'crosshair';
            map.closePopup();
            setLayersInteractive(false, true);
        }

        function clearMeasure() {
            measureMode = null;
            measurePoints = [];
            measureLayer.clearLayers();
            measureMarkers = [];
            measurePolyline = null;
            measurePolygon = null;
            document.getElementById('measure-panel').classList.remove('active');
            document.getElementById('btn-measure-dist').classList.remove('active');
            document.getElementById('btn-measure-area').classList.remove('active');
            map.getContainer().style.cursor = '';
            setLayersInteractive(true, true);
        }

        function formatDistance(meters) {
            if (meters >= 1000) return (meters / 1000).toFixed(2) + ' km';
            return meters.toFixed(0) + ' m';
        }

        function formatArea(sqMeters) {
            if (sqMeters >= 1000000) return (sqMeters / 1000000).toFixed(2) + ' km²';
            if (sqMeters >= 10000) return (sqMeters / 10000).toFixed(2) + ' ha';
            return sqMeters.toFixed(0) + ' m²';
        }

        function computeSphericalArea(latlngs) {
            const rad = Math.PI / 180;
            const R = 6371000;
            let area = 0;
            const n = latlngs.length;
            if (n < 3) return 0;
            for (let i = 0; i < n; i++) {
                const j = (i + 1) % n;
                const k = (i + 2) % n;
                area += (latlngs[j].lng * rad - latlngs[i].lng * rad) * Math.sin(latlngs[k].lat * rad);
            }
            area = Math.abs(area * R * R / 2);
            return area;
        }

        map.on('click', function(e) {
            if (editMode === 'add' || editMode === 'move') return;
            if (!measureMode) return;

            measurePoints.push(e.latlng);

            const marker = L.circleMarker(e.latlng, {
                radius: 4, fillColor: '#fff', color: '#333', weight: 2, fillOpacity: 1, pane: 'measurePane'
            }).addTo(measureLayer);
            measureMarkers.push(marker);

            if (measureMode === 'distance') {
                if (measurePolyline) measureLayer.removeLayer(measurePolyline);
                measurePolyline = L.polyline(measurePoints, { color: '#2196F3', weight: 3, pane: 'measurePane' }).addTo(measureLayer);

                let totalDist = 0;
                for (let i = 1; i < measurePoints.length; i++) {
                    totalDist += measurePoints[i-1].distanceTo(measurePoints[i]);
                }
                document.getElementById('measure-result').textContent = 'Distance: ' + formatDistance(totalDist);
            }

            if (measureMode === 'area') {
                if (measurePolygon) measureLayer.removeLayer(measurePolygon);
                if (measurePoints.length >= 3) {
                    measurePolygon = L.polygon(measurePoints, { color: '#9C27B0', weight: 2, fillOpacity: 0.2, pane: 'measurePane' }).addTo(measureLayer);
                    const area = computeSphericalArea(measurePoints);
                    document.getElementById('measure-result').textContent = 'Superficie: ' + formatArea(area);
                } else {
                    if (measurePoints.length >= 2) {
                        if (measurePolyline) measureLayer.removeLayer(measurePolyline);
                        measurePolyline = L.polyline(measurePoints, { color: '#9C27B0', weight: 2, dashArray: '4,4', pane: 'measurePane' }).addTo(measureLayer);
                    }
                    document.getElementById('measure-result').textContent = `${measurePoints.length}/3 points min.`;
                }
            }
        });

        map.on('dblclick', function(e) {
            if (measureMode) {
                L.DomEvent.stopPropagation(e);
                L.DomEvent.preventDefault(e);
                measureMode = null;
                map.getContainer().style.cursor = '';
                document.getElementById('btn-measure-dist').classList.remove('active');
                document.getElementById('btn-measure-area').classList.remove('active');
                setLayersInteractive(true, true);
            }
        });

        // ===== AUTOCOMPLETE SEARCH =====
        const searchInput = document.getElementById('search-cec');
        const suggestionsDiv = document.getElementById('search-suggestions');
        let activeSuggestion = -1;

        function showSuggestions(query) {
            suggestionsDiv.innerHTML = '';
            activeSuggestion = -1;
            if (!query || query.length < 2) { suggestionsDiv.style.display = 'none'; return; }
            const q = query.toLowerCase();
            const matches = allCEC
                .filter(c => (c.nom_cec || '').toLowerCase().includes(q))
                .slice(0, 10);
            if (!matches.length) { suggestionsDiv.style.display = 'none'; return; }
            matches.forEach((cec, i) => {
                const div = document.createElement('div');
                div.className = 'suggestion';
                div.innerHTML = `${cec.nom_cec}<span class="hint">${cec.commune || ''}</span>`;
                div.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    selectSuggestion(cec);
                });
                suggestionsDiv.appendChild(div);
            });
            suggestionsDiv.style.display = 'block';
        }

        function selectSuggestion(cec) {
            searchInput.value = cec.nom_cec;
            suggestionsDiv.style.display = 'none';
            applyFiltersAndRender();
            if (cec.lat && cec.lng) {
                map.setView([cec.lat, cec.lng], 14);
                cecLayer.eachLayer(m => {
                    if (m.cecData && m.cecData.gid === cec.gid) m.openPopup();
                });
            }
        }

        searchInput.addEventListener('input', () => {
            showSuggestions(searchInput.value.trim());
            applyFiltersAndRender();
        });
        searchInput.addEventListener('keydown', (e) => {
            const items = suggestionsDiv.querySelectorAll('.suggestion');
            if (!items.length) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                activeSuggestion = Math.min(activeSuggestion + 1, items.length - 1);
                items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestion));
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                activeSuggestion = Math.max(activeSuggestion - 1, 0);
                items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestion));
            } else if (e.key === 'Enter' && activeSuggestion >= 0) {
                e.preventDefault();
                const cec = allCEC.filter(c => (c.nom_cec || '').toLowerCase().includes(searchInput.value.trim().toLowerCase()))[activeSuggestion];
                if (cec) selectSuggestion(cec);
            } else if (e.key === 'Escape') {
                suggestionsDiv.style.display = 'none';
            }
        });
        searchInput.addEventListener('blur', () => { setTimeout(() => suggestionsDiv.style.display = 'none', 150); });

        // ===== EVENT LISTENERS =====
        document.getElementById('filter-region').addEventListener('change', () => { updateDepartementOptions(); applyFiltersAndRender(); });
        document.getElementById('filter-departement').addEventListener('change', () => { updateCommuneOptions(); applyFiltersAndRender(); });
        document.getElementById('filter-commune').addEventListener('change', applyFiltersAndRender);
        document.querySelectorAll('.type-filter').forEach(cb => cb.addEventListener('change', applyFiltersAndRender));

        // ===== CEC MANAGEMENT =====
        let editMode = null; // 'add' | 'move'
        let movingCECGid = null;

        function getRegionsList() {
            return [...new Set(allCEC.map(c => c.region).filter(Boolean))].sort();
        }

        function getDepartementsList(region) {
            return [...new Set(allCEC.filter(c => !region || c.region === region).map(c => c.departement).filter(Boolean))].sort();
        }

        function getCommunesList(region, dep) {
            return [...new Set(allCEC.filter(c => (!region || c.region === region) && (!dep || c.departement === dep)).map(c => c.commune).filter(Boolean))].sort();
        }

        function buildOptionsHTML(list, selected) {
            return list.map(v => `<option value="${v}" ${v === selected ? 'selected' : ''}>${v}</option>`).join('');
        }

        function showCECModal(title, cec, onSave) {
            const isEdit = !!cec;
            const c = cec || {};
            const regions = getRegionsList();
            const deps = getDepartementsList(c.region);
            const communes = getCommunesList(c.region, c.departement);

            const overlay = document.createElement('div');
            overlay.className = 'cec-modal-overlay';
            overlay.innerHTML = `
                <div class="cec-modal">
                    <h3><i class="fas fa-${isEdit ? 'pen' : 'plus-circle'}"></i> ${title}</h3>
                    <div class="form-row">
                        <label>Nom du CEC *</label>
                        <input type="text" id="modal-nom" value="${c.nom_cec || ''}" placeholder="Ex: CEC de Yaoundé I">
                    </div>
                    <div class="form-row">
                        <label>Type *</label>
                        <select id="modal-type">
                            <option value="">— Choisir —</option>
                            <option value="Principal" ${c.type_cec === 'Principal' ? 'selected' : ''}>Principal</option>
                            <option value="Secondaire" ${(c.type_cec === 'Secondaire' || c.type_cec === 'Sécondaire') ? 'selected' : ''}>Secondaire</option>
                            <option value="C.U." ${(c.type_cec === 'C.U.' || c.type_cec === 'C.u.') ? 'selected' : ''}>C.U.</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>Région *</label>
                        <select id="modal-region" onchange="modalRegionChanged()">
                            <option value="">— Choisir —</option>
                            ${buildOptionsHTML(regions, c.region)}
                        </select>
                    </div>
                    <div class="form-row">
                        <label>Département *</label>
                        <select id="modal-departement" onchange="modalDepChanged()">
                            <option value="">— Choisir —</option>
                            ${buildOptionsHTML(deps, c.departement)}
                        </select>
                    </div>
                    <div class="form-row">
                        <label>Commune *</label>
                        <select id="modal-commune">
                            <option value="">— Choisir —</option>
                            ${buildOptionsHTML(communes, c.commune)}
                        </select>
                    </div>
                    <div class="form-row-inline">
                        <div class="form-row">
                            <label>N° Immatriculation</label>
                            <input type="text" id="modal-num-ima" value="${c.num_ima || ''}" placeholder="Ex: AD2401">
                        </div>
                        <div class="form-row">
                            <label>Code CEC</label>
                            <input type="text" id="modal-code-cec" value="${c.code_cec || ''}" placeholder="Ex: AD2401">
                        </div>
                    </div>
                    <div class="form-row-inline">
                        <div class="form-row">
                            <label>Réf. COG</label>
                            <input type="text" id="modal-ref-cog" value="${c.ref_cog || ''}" placeholder="Ex: AD0402">
                        </div>
                        <div class="form-row">
                            <label>Date</label>
                            <input type="text" id="modal-date" value="${c.date || ''}" placeholder="JJ/MM/AAAA">
                        </div>
                    </div>
                    <div class="form-row">
                        <label>Nouveau nom CEC</label>
                        <input type="text" id="modal-new-cec" value="${c.new_cec || ''}">
                    </div>
                    <div class="form-row">
                        <label>Observations</label>
                        <textarea id="modal-obs" rows="2" placeholder="Remarques...">${c.obs_req || ''}</textarea>
                    </div>
                    ${isEdit ? '' : `
                    <div class="form-row-inline">
                        <div class="form-row">
                            <label>Latitude *</label>
                            <input type="number" step="any" id="modal-lat" value="${c.lat || ''}" placeholder="Ex: 3.8667">
                        </div>
                        <div class="form-row">
                            <label>Longitude *</label>
                            <input type="number" step="any" id="modal-lng" value="${c.lng || ''}" placeholder="Ex: 11.5167">
                        </div>
                    </div>
                    <p style="font-size:10px;color:#888;margin-top:-5px;">
                        <i class="fas fa-info-circle"></i> Coordonnées pré-remplies si vous avez cliqué la carte.
                    </p>`}
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="this.closest('.cec-modal-overlay').remove()">Annuler</button>
                        <button class="btn btn-primary" id="modal-save-btn"><i class="fas fa-save"></i> Enregistrer</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
            document.getElementById('modal-save-btn').addEventListener('click', () => {
                const data = {
                    nom_cec: document.getElementById('modal-nom').value.trim(),
                    type_cec: document.getElementById('modal-type').value,
                    region: document.getElementById('modal-region').value,
                    departement: document.getElementById('modal-departement').value,
                    commune: document.getElementById('modal-commune').value,
                    num_ima: document.getElementById('modal-num-ima').value.trim(),
                    code_cec: document.getElementById('modal-code-cec').value.trim(),
                    ref_cog: document.getElementById('modal-ref-cog').value.trim(),
                    date: document.getElementById('modal-date').value.trim(),
                    new_cec: document.getElementById('modal-new-cec').value.trim(),
                    obs_req: document.getElementById('modal-obs').value.trim()
                };
                if (!isEdit) {
                    data.lat = parseFloat(document.getElementById('modal-lat').value);
                    data.lng = parseFloat(document.getElementById('modal-lng').value);
                }
                onSave(data, overlay);
            });
        }

        function modalRegionChanged() {
            const region = document.getElementById('modal-region').value;
            const depSel = document.getElementById('modal-departement');
            depSel.innerHTML = '<option value="">— Choisir —</option>' + buildOptionsHTML(getDepartementsList(region));
            modalDepChanged();
        }

        function modalDepChanged() {
            const region = document.getElementById('modal-region').value;
            const dep = document.getElementById('modal-departement').value;
            const comSel = document.getElementById('modal-commune');
            comSel.innerHTML = '<option value="">— Choisir —</option>' + buildOptionsHTML(getCommunesList(region, dep));
        }

        // --- ADD CEC ---
        let pendingAddLatLng = null;

        function startAddCEC() {
            if (measureMode) clearMeasure();
            editMode = 'add';
            pendingAddLatLng = null;
            const bar = document.getElementById('edit-mode-bar');
            document.getElementById('edit-mode-text').innerHTML = '<i class="fas fa-plus-circle"></i> Cliquez sur la carte pour positionner le nouveau CEC';
            bar.style.display = 'flex';
            map.getContainer().style.cursor = 'crosshair';
            map.closePopup();
            setLayersInteractive(false, true);
        }

        function cancelEditMode() {
            editMode = null;
            movingCECGid = null;
            pendingAddLatLng = null;
            document.getElementById('edit-mode-bar').style.display = 'none';
            map.getContainer().style.cursor = '';
            setLayersInteractive(true, true);
        }

        map.on('click', function handleEditClick(e) {
            if (editMode === 'add') {
                pendingAddLatLng = e.latlng;
                cancelEditMode();
                showCECModal('Ajouter un nouveau CEC', null, async (data, overlay) => {
                    if (!data.nom_cec || !data.type_cec || !data.region || !data.departement || !data.commune) {
                        alert('Veuillez remplir tous les champs obligatoires (*).');
                        return;
                    }
                    const lat = pendingAddLatLng ? pendingAddLatLng.lat : data.lat;
                    const lng = pendingAddLatLng ? pendingAddLatLng.lng : data.lng;
                    if (!lat || !lng || isNaN(lat) || isNaN(lng)) {
                        alert('Coordonnées invalides.');
                        return;
                    }
                    const insertData = {
                        nom_cec: data.nom_cec,
                        type_cec: data.type_cec,
                        region: data.region,
                        departement: data.departement,
                        commune: data.commune,
                        num_ima: data.num_ima || null,
                        code_cec: data.code_cec || null,
                        ref_cog: data.ref_cog || null,
                        date: data.date || null,
                        new_cec: data.new_cec || null,
                        obs_req: data.obs_req || null,
                        geom: `SRID=4326;POINT(${lng} ${lat})`
                    };
                    showLoading('Enregistrement...');
                    const { data: result, error } = await db.from('national_cec').insert([insertData]).select();
                    hideLoading();
                    if (error) {
                        alert('Erreur: ' + error.message);
                        return;
                    }
                    overlay.remove();
                    allCEC = await fetchAll('national_cec_view');
                    applyFiltersAndRender();
                    if (result && result[0]) {
                        const newGid = result[0].gid;
                        const newCec = allCEC.find(c => c.gid === newGid);
                        if (newCec && newCec.lat && newCec.lng) {
                            map.setView([newCec.lat, newCec.lng], 14);
                            setTimeout(() => {
                                cecLayer.eachLayer(m => { if (m.cecData && m.cecData.gid === newGid) m.openPopup(); });
                            }, 300);
                        }
                    }
                    alert('CEC ajouté avec succès !');
                });
                if (pendingAddLatLng) {
                    setTimeout(() => {
                        const latInput = document.getElementById('modal-lat');
                        const lngInput = document.getElementById('modal-lng');
                        if (latInput) latInput.value = pendingAddLatLng.lat.toFixed(6);
                        if (lngInput) lngInput.value = pendingAddLatLng.lng.toFixed(6);
                    }, 50);
                }
                return;
            }

            if (editMode === 'move') {
                const newLatLng = e.latlng;
                cancelEditMode();
                if (!confirm(`Déplacer ce CEC vers\nLat: ${newLatLng.lat.toFixed(6)}\nLng: ${newLatLng.lng.toFixed(6)} ?`)) return;
                performMoveCEC(movingCECGid, newLatLng.lat, newLatLng.lng);
                return;
            }
        });

        // --- MOVE CEC ---
        function startMoveCEC(gid) {
            map.closePopup();
            if (measureMode) clearMeasure();
            editMode = 'move';
            movingCECGid = gid;
            const cec = allCEC.find(c => c.gid === gid);
            const name = cec ? cec.nom_cec : 'CEC';
            const bar = document.getElementById('edit-mode-bar');
            document.getElementById('edit-mode-text').innerHTML = `<i class="fas fa-arrows-alt"></i> Cliquez la nouvelle position pour <strong>${name}</strong>`;
            bar.style.display = 'flex';
            map.getContainer().style.cursor = 'crosshair';
            setLayersInteractive(false, true);
        }

        async function performMoveCEC(gid, lat, lng) {
            showLoading('Déplacement...');
            const { error } = await db.from('national_cec')
                .update({ geom: `SRID=4326;POINT(${lng} ${lat})` })
                .eq('gid', gid);
            hideLoading();
            if (error) { alert('Erreur: ' + error.message); return; }
            allCEC = await fetchAll('national_cec_view');
            applyFiltersAndRender();
            map.setView([lat, lng], map.getZoom() < 12 ? 14 : map.getZoom());
            setTimeout(() => {
                cecLayer.eachLayer(m => { if (m.cecData && m.cecData.gid === gid) m.openPopup(); });
            }, 300);
            alert('CEC déplacé avec succès !');
        }

        // --- EDIT CEC ---
        function openEditCEC(gid) {
            map.closePopup();
            const cec = allCEC.find(c => c.gid === gid);
            if (!cec) { alert('CEC introuvable.'); return; }
            showCECModal('Modifier — ' + (cec.nom_cec || 'CEC'), cec, async (data, overlay) => {
                if (!data.nom_cec || !data.type_cec || !data.region || !data.departement || !data.commune) {
                    alert('Veuillez remplir tous les champs obligatoires (*).');
                    return;
                }
                const updateData = {
                    nom_cec: data.nom_cec,
                    type_cec: data.type_cec,
                    region: data.region,
                    departement: data.departement,
                    commune: data.commune,
                    num_ima: data.num_ima || null,
                    code_cec: data.code_cec || null,
                    ref_cog: data.ref_cog || null,
                    date: data.date || null,
                    new_cec: data.new_cec || null,
                    obs_req: data.obs_req || null
                };
                showLoading('Mise à jour...');
                const { error } = await db.from('national_cec').update(updateData).eq('gid', gid);
                hideLoading();
                if (error) { alert('Erreur: ' + error.message); return; }
                overlay.remove();
                allCEC = await fetchAll('national_cec_view');
                applyFiltersAndRender();
                setTimeout(() => {
                    cecLayer.eachLayer(m => { if (m.cecData && m.cecData.gid === gid) m.openPopup(); });
                }, 300);
                alert('CEC mis à jour avec succès !');
            });
        }

        // --- DELETE CEC ---
        async function deleteCEC(gid) {
            const cec = allCEC.find(c => c.gid === gid);
            if (!cec) { alert('CEC introuvable.'); return; }
            if (!confirm(`Supprimer le CEC « ${cec.nom_cec} » (${cec.commune}) ?\n\nCette action est irréversible.`)) return;
            map.closePopup();
            showLoading('Suppression...');
            const { error } = await db.from('national_cec').delete().eq('gid', gid);
            hideLoading();
            if (error) { alert('Erreur: ' + error.message); return; }
            allCEC = await fetchAll('national_cec_view');
            applyFiltersAndRender();
            alert('CEC supprimé avec succès !');
        }

        // ===== INIT =====
        if (window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.add('collapsed');
        }
        loadAllData();
    </script>
</body>
</html>
